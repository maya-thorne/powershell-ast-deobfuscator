<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400">
  <defs>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="960" height="400" rx="12" fill="url(#pipeGrad)" stroke="#334155" stroke-width="1.5" />
  <text x="480" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">PowerShell AST Deobfuscation Pipeline Architecture</text>
  <text x="480" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Multi-Pass Pushdown Automaton &amp; Fixed-Point Normalization Flow</text>

  <!-- Stage 1 -->
  <g transform="translate(40, 110)">
    <rect width="180" height="220" rx="10" fill="url(#boxGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="90" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">Phase 1: Lexical Scan</text>
    <path d="M 20 45 L 160 45" stroke="#334155" stroke-width="1" />
    <text x="20" y="75" font-family="monospace" font-size="11" fill="#cbd5e1">&#x2022; Backtick Strip (`)</text>
    <text x="20" y="105" font-family="monospace" font-size="11" fill="#cbd5e1">&#x2022; Single/Double Quotes</text>
    <text x="20" y="135" font-family="monospace" font-size="11" fill="#cbd5e1">&#x2022; $var &amp; ${...}</text>
    <text x="20" y="165" font-family="monospace" font-size="11" fill="#cbd5e1">&#x2022; -f Format Operator</text>
    <text x="20" y="195" font-family="monospace" font-size="11" fill="#cbd5e1">&#x2022; Comments &amp; Whitespace</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 225 220 L 265 220" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Stage 2 -->
  <g transform="translate(270, 110)">
    <rect width="180" height="220" rx="10" fill="url(#boxGrad)" stroke="#818cf8" stroke-width="1.5" />
    <text x="90" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#818cf8" text-anchor="middle">Phase 2: AST Parser</text>
    <path d="M 20 45 L 160 45" stroke="#334155" stroke-width="1" />
    <text x="20" y="75" font-family="monospace" font-size="11" fill="#cbd5e1">&#x2022; ScriptBlock Node</text>
    <text x="20" y="105" font-family="monospace" font-size="11" fill="#cbd5e1">&#x2022; Pipeline Node (|)</text>
    <text x="20" y="135" font-family="monospace" font-size="11" fill="#cbd5e1">&#x2022; Command &amp; Args</text>
    <text x="20" y="165" font-family="monospace" font-size="11" fill="#cbd5e1">&#x2022; FormatOp Tree</text>
    <text x="20" y="195" font-family="monospace" font-size="11" fill="#cbd5e1">&#x2022; Binary Expression (+)</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 455 220 L 495 220" stroke="#818cf8" stroke-width="2" />

  <!-- Stage 3 -->
  <g transform="translate(500, 110)">
    <rect width="180" height="220" rx="10" fill="url(#boxGrad)" stroke="#a78bfa" stroke-width="1.5" />
    <text x="90" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#a78bfa" text-anchor="middle">Phase 3: Normalizer</text>
    <path d="M 20 45 L 160 45" stroke="#334155" stroke-width="1" />
    <text x="20" y="75" font-family="monospace" font-size="11" fill="#cbd5e1">&#x2022; Constant Folding</text>
    <text x="20" y="105" font-family="monospace" font-size="11" fill="#cbd5e1">&#x2022; -f String Inlining</text>
    <text x="20" y="135" font-family="monospace" font-size="11" fill="#cbd5e1">&#x2022; Parentheses Unwrap</text>
    <text x="20" y="165" font-family="monospace" font-size="11" fill="#cbd5e1">&#x2022; Symbol Resolution</text>
    <text x="20" y="195" font-family="monospace" font-size="11" fill="#cbd5e1">&#x2022; AST to_source()</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 685 220 L 725 220" stroke="#a78bfa" stroke-width="2" />

  <!-- Stage 4 -->
  <g transform="translate(730, 110)">
    <rect width="190" height="220" rx="10" fill="url(#boxGrad)" stroke="#34d399" stroke-width="1.5" />
    <text x="95" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#34d399" text-anchor="middle">Phase 4: Convergence</text>
    <path d="M 20 45 L 170 45" stroke="#334155" stroke-width="1" />
    <text x="20" y="75" font-family="monospace" font-size="11" fill="#cbd5e1">&#x2022; Fixed-Point Iteration</text>
    <text x="20" y="105" font-family="monospace" font-size="11" fill="#cbd5e1">&#x2022; EncodedCommand Dec</text>
    <text x="20" y="135" font-family="monospace" font-size="11" fill="#cbd5e1">&#x2022; Concat Merging</text>
    <text x="20" y="165" font-family="monospace" font-size="11" fill="#cbd5e1">&#x2022; Clean Script Output</text>
    <text x="20" y="195" font-family="monospace" font-size="11" fill="#cbd5e1">&#x2022; Human Readable</text>
  </g>
</svg>
